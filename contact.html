<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Contact - CP Progress Tracker</title>

        <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    </head>

    <body>
        <header>

            <nav>
                <div class="logo">
                    <i class="fa-solid fa-code">

                    </i>

                    <h2>CP Tracker</h2>
                </div>

                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="profile.html">Profile</a></li>
                    <li><a href="contests.html">Contests</a></li>
                    <li><a href="notifications.html">Notifications</a></li>
                    <li><a href="settings.html">Settings</a></li>
                </ul>

            </nav>
        </header>

        <main class="contact-page">
            <h1>Contact Us</h1>


            <p>Have any questions or suggestions? Feel free to contact us.</p>

            <div class="contact-container">
                <div class="contact-info">
                    <h2>Get In Touch</h2>

                    <div class="contact-item">
                        <i class="fa-solid fa-envelope">

                        </i>
                        <div>
                            <h3>Email

                            </h3>
                            <p>cpprogresstracker@gmail.com</p>
                        </div>

                    </div>
                </div>

            </div>

            <div class="contact-form">
                <h2>Send Us a Message</h2>
                <form>
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Enter your name"required>

                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>

                    <label for="msg">Message</label>
                    <textarea id="msg" rows="6" placeholder="Write your messages" required>

                    </textarea>
                    <button type="submit">
                        <i class="fa-solid fa-paper-plane">

                        </i>
                        Send Message
                    </button>

                </form>
            </div>
            
            
        </main>

        <footer>
              <p>© 2026 CP Progress Tracker. All Rights Reserved.</p>

        </footer>
    </body>
</html>
